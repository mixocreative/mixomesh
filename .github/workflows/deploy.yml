# Builds the web app and publishes dist/ to GitHub Pages on every push to the
# default branch. No local steps needed — GitHub runs this. Enable it once under
# repo Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vite 8 (rolldown) ships its native binary as a per-platform
      # optionalDependency. The Windows-generated package-lock.json records only
      # the win32 binary, and npm's optional-deps bug (npm/cli#4828) means even a
      # plain `npm install` keeps the locked tree and never fetches the linux one
      # — the build then dies with "Cannot find native binding". Deleting the
      # lockfile first forces a fresh resolve that picks up the linux-x64 binary.
      # (node_modules doesn't exist on a clean runner, so only the lockfile needs
      # removing.) The official npm-bug workaround, applied in CI.
      - run: rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
