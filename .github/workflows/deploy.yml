# Builds the web app and publishes dist/ to GitHub Pages on every push to the
# default branch. No local steps needed — GitHub runs this. Enable it once under
# repo Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm install`, not `npm ci`: Vite 8 (rolldown) ships its native binary as
      # a per-platform optionalDependency. A lockfile generated on Windows records
      # only the win32 binary, and `npm ci` installs exactly the lockfile — so the
      # linux-x64 binary is missing and the build dies with MODULE_NOT_FOUND.
      # `npm install` re-resolves optional deps for the runner's platform.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
