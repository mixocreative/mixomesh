# electron-builder packaging config (ADR 0001 Phase 3). Produces a Windows NSIS
# installer from the built web app + the Electron shell.
#
# Run: `npm i -D electron-builder && npm run build && npm run dist`
# (heavy: downloads build tooling + writes an installer to release/). Optional
# code-signing (SmartScreen warns until signed). macOS target deferred (ADR 0001).
appId: com.mixomesh.app
productName: MIXOMESH
directories:
  output: release
  buildResources: electron
files:
  - dist/**/*
  - electron/**/*
  # Listbridge portable core (ESM), loaded by electron/listbridge/index.cjs via import().
  - src/listbridge/**/*
  - package.json
# Third-party notices (licence scan M2): also inside the app via dist/**; this copy sits next to
# the executable in resources/ where users and auditors look for it.
extraResources:
  - from: dist/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# cloudflared is NOT bundled (Cults3D uploads natively). A URL-only platform downloads the pinned,
# SHA-256-verified copy once into <userData>/listbridge/ on first use (electron/listbridge/cloudflaredPin.cjs).
win:
  target: nsis
  # .mixo double-click -> `MIXOMESH.exe "%1"` (launch integration LI.5; registry hooks in electron/installer.nsh).
  fileAssociations:
    - ext: mixo
      name: MIXOMESH project
      description: MIXOMESH project
      role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: electron/installer.nsh
  # EULA shown on the installer licence page (EULA.txt in the repo root).
  license: EULA.txt
  # Installer file name used by scripts/build-installer.mjs (copied to installers/).
  artifactName: MIXOMESH-Setup-${version}.${ext}

# Package the exact Electron already installed for dev (node_modules/electron) instead of
# re-downloading it: same version as development, and no hang on its checksum download.
electronDist: node_modules/electron/dist
