# electron-builder packaging config (ADR 0001 Phase 3). Produces a Windows NSIS
# installer from the built web app + the Electron shell.
#
# Run: `npm i -D electron-builder && npm run build && npm run dist`
# (heavy: downloads build tooling + writes an installer to release/). Optional
# code-signing (SmartScreen warns until signed). macOS target deferred (ADR 0001).
appId: com.mixomesh.app
productName: MIXOMESH
directories:
  output: release
  buildResources: electron
files:
  - dist/**/*
  - electron/**/*
  # Listbridge portable core (ESM), loaded by electron/listbridge/index.cjs via import().
  - src/listbridge/**/*
  - package.json
# Listbridge temporary links (PB.5b): ship cloudflared + its Apache-2.0 licence. Fetched and
# SHA-256-verified into vendor/cloudflared/ by scripts/fetch-cloudflared.mjs (`npm run dist`
# runs it first). Resolved at runtime from <resources>/listbridge/cloudflared.exe.
extraResources:
  - from: vendor/cloudflared/cloudflared-windows-amd64.exe
    to: listbridge/cloudflared.exe
  - from: vendor/cloudflared/LICENSE
    to: listbridge/cloudflared-LICENSE.txt
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
