<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIXOMESH</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <script type="importmap">
  {
    "imports": {
      "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
    }
  }
  </script>
  <script defer src="https://cdn.babylonjs.com/babylon.js"></script>
  <script defer src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.js"></script>
  <script defer src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <script defer src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.js"></script>
</head>
<body>
  <div id="app">
    <header id="header">
      <span id="project-name">Untitled</span>
      <span id="dirty-indicator"></span>
    </header>

    <aside id="outliner"></aside>

    <div id="viewport">
      <canvas id="renderCanvas" tabindex="0"></canvas>
      <div id="viewport-drop-overlay"></div>
      <div id="nav-cube" class="nav-cube"></div>
      <div id="viewport-toolbar" class="viewport-toolbar"></div>
    </div>

    <aside id="right-panel">
      <section class="rp-section" id="rp-properties">
        <header class="rp-section-header" data-toggle="rp-properties">
          <span class="rp-chev"></span>
          <span class="rp-title">Properties</span>
        </header>
        <div class="rp-body" id="rp-properties-body"></div>
      </section>
      <div class="rp-splitter" data-rp-splitter aria-hidden="true"></div>
      <section class="rp-section" id="rp-shaders">
        <header class="rp-section-header" data-toggle="rp-shaders">
          <span class="rp-chev"></span>
          <span class="rp-title">Shader Library</span>
        </header>
        <div class="rp-body" id="rp-shaders-body"></div>
      </section>
      <section class="rp-section" id="rp-print">
        <header class="rp-section-header" data-toggle="rp-print">
          <span class="rp-chev"></span>
          <span class="rp-title">Print</span>
        </header>
        <div class="rp-body" id="rp-print-body"></div>
      </section>
    </aside>

    <div id="asset-panel"></div>

    <div id="status-bar"></div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
